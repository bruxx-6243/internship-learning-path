<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Gestionnaire de tâches</h1>

        <form id="task-form">
            <!-- <input type="reset" value="reinitialiser"> -->
            <input id="task-title" type="text" placeholder="Titre de la tâche" >
            <textarea id="task-description" placeholder="Description"></textarea>

            <select id="task-priority">
                <option value="low">Basse</option>
                <option value="medium">Moyenne</option>
                <option value="high">Haute</option>
            </select>
            
            <button type="submit">Ajouter</button>
            
        </form>

        <section id="statistics">
            <p>Total : <span id="total-count">0</span></p>
            <p>Terminées : <span id="completed-count">0</span></p>
            <p>En attente : <span id="pending-count">0</span></p>
        </section>

        <section>
            <input id="search-input" type="search" placeholder="Rechercher une tâche">

            <select id="filter-select">
                <option value="all">Toutes</option>
                <option value="completed">Terminées</option>
                <option value="pending">En attente</option>
            </select>
        </section>

        <section>
            <ul id="task-list">
            </ul>
            <div>
                <label for="notCompleted"  hidden> Non Complété</label>
                <input type="radio" id="notCompleted" value="0" name="status" checked hidden>
                <label for="completed"  hidden>Completer</label>
                <input type="radio" id="completed" value="1" name="status"  hidden>
            </div>
            <p id="empty-message" >Aucune tâche pour le moment.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
